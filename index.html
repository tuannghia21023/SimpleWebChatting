<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
      <input type="text" id="messageInput" class="input-field" placeholder="Type a message..." />
      <button id="sendBtn" class="send-btn">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io(); // Connect to the server

    const sendBtn = document.getElementById('sendBtn');
    const messageInput = document.getElementById('messageInput');
    const chatBox = document.getElementById('chatBox');

    // Function to append new message to the chat box
    function appendMessage(message, fromUser = true) {
      const messageDiv = document.createElement('div');
      messageDiv.classList.add('message');
      messageDiv.textContent = (fromUser ? "You: " : "Someone: ") + message;
      chatBox.appendChild(messageDiv);
      chatBox.scrollTop = chatBox.scrollHeight; // Scroll to the bottom
    }

    // Listen for incoming chat messages from the server
    socket.on('chatMessage', (msg) => {
      appendMessage(msg, false); // false indicates the message is from another user
    });

    // Send a message when the send button is clicked
    sendBtn.addEventListener('click', function() {
      const message = messageInput.value.trim();
      if (message) {
        appendMessage(message, true); // true indicates the message is from the current user
        socket.emit('chatMessage', message); // Emit the message to the server
        messageInput.value = ''; // Clear the input
      }
    });

    // Optionally, allow sending with Enter key
    messageInput.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        sendBtn.click();
      }
    });
  </script>
</body>
</html>
